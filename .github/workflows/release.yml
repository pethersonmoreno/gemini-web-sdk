name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v1.2.0)"
        required: true
        type: string
      ref:
        description: "Git ref to tag (commit SHA, branch name, or tag)"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse-version.outputs.version }}
    steps:
      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@v4

      - name: Checkout at ref
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Parse version
        id: parse-version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          node -e "
            const version = '${{ steps.parse-version.outputs.version }}'.replace(/^v/, '');
            const fs = require('fs');
            const content = fs.readFileSync('CHANGELOG.md', 'utf8');
            const sections = content.split(/(?=^## )/m);
            let found = false;
            let notes = '';
            for (const section of sections) {
              const m = section.match(/^## \[([^\]]+)\].*?-\s*(\d{4}-\d{2}-\d{2})/s);
              if (m && m[1].replace(/^v/, '') === version) {
                notes = section.replace(/^## \[[^\]]+\].*?-\s*\d{4}-\d{2}-\d{2}\n/, '').trim();
                found = true;
                break;
              }
            }
            if (!found) {
              console.error('No changelog section found for version:', version);
              process.exit(1);
            }
            fs.writeFileSync('RELEASE_NOTES.md', notes);
            console.log('Extracted', notes.split('\n').length, 'lines for version', version);
          "

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.parse-version.outputs.version }}
          name: ${{ steps.parse-version.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(steps.parse-version.outputs.version, '-') }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      id-token: write
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Validate prepublish checks
        run: npm test

      - name: Detect repository context
        id: context
        run: |
          GITHUB_SERVER_URL="${{ github.server_url }}"
          GITHUB_REPOSITORY="${{ github.repository }}"
          GITHUB_REPOSITORY_URL="${{ github.server_url }}/${{ github.repository }}"
          GITHUB_OWNER="${{ github.repository_owner }}"
          GITHUB_OWNER_DISPLAY_NAME="${{ github.event.repository.owner.name }}"
          if [ -z "$GITHUB_OWNER_DISPLAY_NAME" ] || [ "$GITHUB_OWNER_DISPLAY_NAME" = "null" ]; then
            GITHUB_OWNER_DISPLAY_NAME="$GITHUB_OWNER"
          fi
          ORIGINAL_GITHUB_REPO=$(node -p "require('./package.json').repository.url.replaceAll(/^[^\/]+\/\/github\.com\//g, '').replaceAll(/\.git$/g, '')")
          
          if [ "$GITHUB_REPOSITORY" != "$ORIGINAL_GITHUB_REPO" ]; then
            IS_FORK="true"
          else
            IS_FORK="false"
          fi

          echo "GITHUB_REPOSITORY_URL=$GITHUB_REPOSITORY_URL" >> $GITHUB_ENV
          echo "IS_FORK=$IS_FORK" >> $GITHUB_ENV

          echo "GITHUB_OWNER=$GITHUB_OWNER" >> $GITHUB_ENV
          echo "GITHUB_OWNER_DISPLAY_NAME=$GITHUB_OWNER_DISPLAY_NAME" >> $GITHUB_ENV

      - name: Adjust package settings for fork
        if: env.IS_FORK == 'true'
        run: |
          PKG_NAME=$(node -p "require('./package.json').name.split('/').pop()")
          echo "Updating package name to scope of fork @$GITHUB_OWNER/$PKG_NAME"
          npm pkg set name="@$GITHUB_OWNER/$PKG_NAME"

          PKG_AUTHOR=$(node -p "require('./package.json').author")
          if [ $(echo "$PKG_AUTHOR" | grep "$GITHUB_OWNER_DISPLAY_NAME" | wc -l) -eq 0 ]; then
            echo "Updating package author to add the owner of the repository to it: $GITHUB_OWNER_DISPLAY_NAME"
            npm pkg set author="$PKG_AUTHOR and $GITHUB_OWNER_DISPLAY_NAME"
          fi

          echo "Updating repository URLs in package.json"
          npm pkg set repository.type="git" repository.url="git+${GITHUB_REPOSITORY_URL}.git"
          npm pkg set bugs.url="${GITHUB_REPOSITORY_URL}/issues"
          npm pkg set homepage="${GITHUB_REPOSITORY_URL}#readme"

      - name: Publish to npm (Fork context)
        if: env.IS_FORK == 'true'
        run: |
          unset NPM_CONFIG_USERCONFIG
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          npm stage publish --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: env.IS_FORK == 'false'
        run: |
          unset NPM_CONFIG_USERCONFIG
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          npm publish --provenance --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
